apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: personal-finance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: personal-finance-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: django-secret-key
            - name: DJANGO_DEBUG
              value: "False"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_USER
              value: finance
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: finance
            - name: MONGO_URI
              value: "mongodb://finance:$(MONGO_PASSWORD)@mongodb:27017/finance?authSource=admin"
            - name: MONGO_DB_NAME
              value: finance_transactions
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
          envFrom:
            - secretRef:
                name: finance-secrets
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: personal-finance
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
